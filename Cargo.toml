[package]
name = "m3u8-GUI"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "system_fonts"] }
egui = { version = "0.37.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
tokio = { version = "1.54.1", features = ["full"], default-features = false }
regex = { version = "1.13.2", default-features = false }
md5 = { version = "0.8.1", default-features = false }
rfd = { version = "0.18.0", default-features = false }

[profile.release]       # ITC = Impacto no tempo de compilação
opt-level = 3           # Máxima otimização. (padrão no --release)
lto = "fat"             # Otimização total na ligação. ITC: Alto. (não padrão)
codegen-units = 1       # Mais otimizações, menos paralelismo. ITC: Moderado a Alto. (não padrão)
panic = "abort"         # Aborta em pânico, reduzindo código de tratamento (não padrão)
strip = true            # Remove símbolos de depuração, reduzindo o tamanho do binário. (não padrão)
incremental = false     # ITC: Moderado. (padrão)
debug = false           # (padrão)
rpath = false           # (não padrão)
split-debuginfo = "off" # (não padrão)
